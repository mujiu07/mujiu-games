<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="mujiu 的网页小游戏合集 · 8 个打开即玩、无需注册的小游戏">
<title>games | visitor@game.mujiu.net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/theme.css?v=20260924">
<style>
    .shell { max-width: 820px; padding-top: 18px; }

    .term {
        border: 1px solid var(--line);
        border-radius: 14px;
        background: color-mix(in srgb, var(--panel) 72%, transparent);
        backdrop-filter: blur(10px);
        padding: 22px 20px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
        font-size: 14px;
    }
    #term { white-space: pre; overflow-x: auto; line-height: 1.75; }
    .input-line { display: flex; align-items: center; white-space: pre; }
    .prompt { color: var(--primary); }
    #input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-100);
        caret-color: var(--primary);
        font-family: inherit;
        font-size: inherit;
    }
    .game-item-link { color: var(--text-100); text-decoration: none; cursor: pointer; }
    .game-item-link:hover {
        color: var(--primary);
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        text-decoration: none;
    }
    .sys { color: var(--secondary); }
    .err { color: var(--danger); }

    .hint { color: var(--text-300); font-size: 12px; margin-top: 14px; text-align: center; }
    .hint kbd {
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        padding: 1px 6px;
        font-family: inherit;
        font-size: 11px;
        color: var(--text-200);
    }
</style>
<script src="/theme.js?v=20260924"></script>
</head>
<body>
<div class="shell">
    <div class="mj-bar">
        <div class="brand"><div class="logo">M</div><span>mujiu</span></div>
        <nav>
            <a href="https://mujiu.net">主站</a>
            <a href="https://gui.mujiu.net">图形版</a>
            <a href="https://ask.mujiu.net">留言箱</a>
        </nav>
    </div>

    <div class="term">
        <div id="term"></div>
        <!-- @ 用实体写成 &#64;：Cloudflare 邮箱混淆会把 user@host 形式当邮箱改写，导致提示符被替换成 [email protected] -->
        <div class="input-line"><span class="prompt">visitor&#64;game.mujiu.net:~ $ </span><input id="input" autofocus autocomplete="off" spellcheck="false" aria-label="命令输入"></div>
    </div>

    <div class="hint">
        <kbd>Tab</kbd> 补全游戏名 · <kbd>↑</kbd><kbd>↓</kbd> 翻历史 · 输入游戏名回车即可开始
    </div>

    <div class="mj-foot">
        © <span id="year"></span> 樊旭阳 · <span class="g">game.mujiu.net</span> · <a href="https://mujiu.net">mujiu.net</a>
    </div>
</div>

<script>
    // 游戏列表配置
    const games = [
        {name:"snake", label:"贪吃蛇", url:"/snake/"},
        {name:"tetris", label:"俄罗斯方块", url:"/tetris/"},
        {name:"2048", label:"2048", url:"/2048/"},
        {name:"flappy", label:"Flappy Bird", url:"/flappy/"},
        {name:"minesweeper", label:"扫雷", url:"/minesweeper/"},
        {name:"breakout", label:"打砖块", url:"/breakout/"},
        {name:"gobang", label:"五子棋", url:"/gobang/"},
        {name:"tictactoe", label:"井字棋", url:"/tictactoe/"}
    ]
    // 全部可tab补全的指令（内置命令+游戏名）
    const builtinCmds = ["ls", "clear", "help"];
    const gameNames = games.map(g=>g.name);
    const allCmds = [...builtinCmds, ...gameNames];

    const $term = document.getElementById('term');
    const $input = document.getElementById('input');
    let history = [];
    let historyIdx = -1;
    const promptPrefix = '<span class="prompt">visitor@game.mujiu.net:~ $ </span>';

    document.getElementById('year').textContent = new Date().getFullYear();

    // 打印文本，支持传入可点击html
    function print(html){
        $term.innerHTML += html + "\n";
    }
    // 渲染ls游戏列表
    function renderGameList() {
        games.forEach(g=>{
            const line = `> <a class="game-item-link" href="${g.url}">${g.name.padEnd(12)}</a> ${g.label}`
            print(line);
        })
        print("");
    }
    function renderHelp(){
        print(`<span class="sys">可用命令：</span>`);
        print(`  ls              列出全部游戏`);
        print(`  <game>          直接输入游戏名开始，例如 snake`);
        print(`  clear           清屏`);
        print(`  help            显示本帮助`);
        print("");
    }
    // 初始化自动ls
    print(`${promptPrefix}ls games/`);
    renderGameList();

    // 执行命令
    function runCmd(raw){
        const cmd = raw.trim();
        if(!cmd) return;
        history.push(cmd);
        historyIdx = history.length;
        print(`${promptPrefix}${cmd}`);

        if(cmd === "ls" || cmd === "ls games" || cmd === "ls games/"){
            renderGameList();
        }else if(cmd === "clear"){
            $term.innerHTML = "";
        }else if(cmd === "help"){
            renderHelp();
        }else if(gameNames.includes(cmd)){
            const target = games.find(g=>g.name===cmd);
            print(`opening ${cmd} ...`);
            window.location.href = target.url;
        }else{
            print(`<span class="err">command not found: ${cmd}</span>  试试 help`);
            print("");
        }
    }

    // Tab自动补全（同时支持ls/clear和游戏名）
    function complete(word){
        const match = allCmds.filter(n=>n.startsWith(word));
        if(match.length === 1){
            return match[0];
        }else if(match.length>1){
            print(match.join("  "));
            print("");
        }
        return word;
    }

    // 键盘监听
    $input.addEventListener("keydown", e=>{
        if(e.key === "Enter"){
            runCmd($input.value);
            $input.value = "";
        }else if(e.key === "Tab"){
            e.preventDefault();
            $input.value = complete($input.value.trim());
        }else if(e.key === "ArrowUp"){
            e.preventDefault();
            if(historyIdx>0) $input.value = history[--historyIdx];
        }else if(e.key === "ArrowDown"){
            e.preventDefault();
            if(historyIdx<history.length-1) $input.value = history[++historyIdx];
            else {historyIdx=history.length; $input.value="";}
        }
    })
    // 自动聚焦输入框
    document.body.addEventListener("click",()=>$input.focus())
</script>
</body>
</html>
