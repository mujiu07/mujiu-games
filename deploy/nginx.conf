server {
    listen 80;
    server_name game.mujiu.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name game.mujiu.net;
    ssl_certificate /etc/letsencrypt/live/game.mujiu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.mujiu.net/privkey.pem;

    root /var/www/game;
    index index.html;

    # HTML 一律不缓存：用 no-store，比 no-cache 更绝对。
    # no-cache 只是"每次先问服务器"；若浏览器手里还留着早期没有缓存头时
    # 按启发式规则缓存的旧副本，它可能直接使用副本、根本不发请求，
    # 服务端再怎么改响应头也救不了（2026-09-22 实测踩过：无痕是新版、
    # 普通窗口一直是旧版）。no-store 让浏览器不为 HTML 留任何副本。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # 适配单页小游戏路由（子目录首页同样不缓存）
    location ~ ^/[^/]+/ {
        try_files $uri $uri/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # 静态资源：图片久一点，css/js 只留 1 小时（theme.css 是唯一真源，改动要能快速生效）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
    }
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # 部署与文档类文件不外泄（此前 /README.md 与 /deploy/nginx.conf 公网可读，2026-09-24 修复）
    location ~* \.(md|sql|conf|bak|log|sh|yml|yaml|ini|example|env)$ {
        deny all;
        access_log off;
    }
    location ^~ /deploy/ {
        deny all;
        access_log off;
    }

    # 隐藏文件（.gitignore / .DS_Store 等）403，放行 ACME 校验路径（与 mujiu 站一致）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
