server {
    listen 80;
    server_name game.mujiu.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name game.mujiu.net;
    ssl_certificate /etc/letsencrypt/live/game.mujiu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.mujiu.net/privkey.pem;

    root /var/www/game;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # 适配单页小游戏路由
    location ~ ^/[^/]+/ {
        try_files $uri $uri/index.html;
    }
    location ~* \.(png|jpg|ico|svg|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
