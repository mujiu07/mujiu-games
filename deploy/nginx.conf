server {
    listen 80;
    server_name game.mujiu.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name game.mujiu.net;
    ssl_certificate /etc/letsencrypt/live/game.mujiu.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.mujiu.net/privkey.pem;

    root /var/www/game;
    index index.html;

    # HTML 一律不缓存：否则部署后浏览器/中间层会继续显示旧页面
    location / {
        try_files $uri $uri/ /index.html;
        expires epoch;
    }
    # 适配单页小游戏路由
    location ~ ^/[^/]+/ {
        try_files $uri $uri/index.html;
        expires epoch;
    }
    # 静态资源：图片久一点，css/js 只留 1 小时（theme.css 是唯一真源，改动要能快速生效）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
    }
    location ~* \.(css|js)$ {
        expires 1h;
    }
}
